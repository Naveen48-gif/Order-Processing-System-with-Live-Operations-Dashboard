server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ${APP_NAME:order-management}
  lifecycle:
    # Give in-flight order workers time to finish their transaction on shutdown.
    timeout-per-shutdown-phase: 25s
  datasource:
    # Canonical runtime target is PostgreSQL (Docker locally, AWS RDS in production).
    # Everything is env-driven, so moving to RDS is a configuration change only - no code change.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USERNAME:orderuser}
    password: ${DB_PASSWORD:orderpass}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: order-hikari-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        # Batching helps the concurrency test insert 100 orders quickly.
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_PREFETCH:20}
        concurrency: ${RABBITMQ_LISTENER_CONCURRENCY:5}
        max-concurrency: ${RABBITMQ_LISTENER_MAX_CONCURRENCY:10}
        # Retry is deliberately disabled at container level: bounded retry + DLQ are implemented
        # explicitly so the retry count is persisted on the order and observable in the dashboard.
        retry:
          enabled: false
        default-requeue-rejected: false
  threads:
    virtual:
      # A real bounded platform-thread pool is required here, so virtual threads stay off on purpose.
      enabled: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

order:
  seed:
    # Demo catalogue for the dashboard. Disabled by the test profile, which owns its own fixtures.
    enabled: ${ORDER_SEED_ENABLED:true}
  ops:
    fault-injection:
      # Operational failure drill (inject N transient faults for a product). Off unless switched on
      # explicitly, and the endpoint is only registered while it is on - a production deployment
      # cannot be talked into injecting failures through an API call.
      enabled: ${ORDER_OPS_FAULT_INJECTION_ENABLED:false}
  processing:
    core-pool-size: ${ORDER_CORE_POOL_SIZE:10}
    max-pool-size: ${ORDER_MAX_POOL_SIZE:10}
    queue-capacity: ${ORDER_QUEUE_CAPACITY:100}
    keep-alive-seconds: ${ORDER_KEEP_ALIVE_SECONDS:60}
    await-termination-seconds: ${ORDER_AWAIT_TERMINATION_SECONDS:30}
    max-retry-attempts: ${ORDER_MAX_RETRY_ATTEMPTS:3}
    retry-backoff-ms: ${ORDER_RETRY_BACKOFF_MS:300}
  messaging:
    # rabbitmq   -> canonical path: real broker, real DLX/DLQ (Docker or managed service)
    # in-process -> fallback for machines without a broker binary; same processor pipeline, bounded pool
    transport: ${ORDER_MESSAGING_TRANSPORT:rabbitmq}
    exchange: ${ORDER_EXCHANGE:order.exchange}
    queue: ${ORDER_QUEUE:order.queue}
    routing-key: ${ORDER_ROUTING_KEY:order.routing-key}
    dlx: ${ORDER_DLX:order.dlx}
    dlq: ${ORDER_DLQ:order.dlq}
    dlq-routing-key: ${ORDER_DLQ_ROUTING_KEY:order.dlq.routing-key}

logging:
  level:
    root: INFO
    com.ordermanagement: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

